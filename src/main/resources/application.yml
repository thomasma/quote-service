spring:
  application:
    name: quote-service
  profiles:
    active: "dev"
  main:
    banner-mode: "off"

---

spring:
  config:
    activate:
      on-profile: dev
server:
  quoteSvcURI: https://api.chucknorris.io
  quoteSvcPath: "/jokes/random"
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

---

spring:
  config:
    activate:
      on-profile: test
server:
  quoteSvcURI: https://api.chucknorris.io
  quoteSvcPath: "/jokes/random"
  port: 80

---

server:
  port: 80

---
# INTERNATIONALIZATION (MessageSourceAutoConfiguration)
spring:
  messages:
    basename: messages
    cache-duration: 10m
    encoding: UTF-8


logging:
   level:
     ROOT: INFO
     com.aver: DEBUG
     org.springframework: INFO
     
---


management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,prometheus

---
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        # RestTemplate wraps connection failures and timeouts in ResourceAccessException and
        # HTTP errors in HttpStatusCodeException, both subclasses of RestClientException
        recordExceptions:
                - org.springframework.web.client.RestClientException
    instances:
      quoteService:
        baseConfig: default